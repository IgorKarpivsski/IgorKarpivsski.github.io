  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: Rubik, 'Segoe UI', Arial, sans-serif; color: #fff; }

  canvas { position: absolute; inset: 0; width: 1080px; height: 620px; pointer-events: none; }

  /* לוח רקע */

  body.nobg .crest .halo { opacity: .45; inset: 5%; }

    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.75) 48%, transparent 58%); background-size: 280% 100%; animation: shine 3.2s ease-in-out infinite; mix-blend-mode: overlay; }

  /* סמלים */
  .crest { position: absolute; top: 300px; width: 190px; height: 210px; display: grid; place-items: center; }
  .crest.barca { right: 50px; animation: inRight 1s .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  .crest.real { left: 50px; animation: inLeft 1s .65s cubic-bezier(.2, 1.4, .4, 1) both; }
  .crest .sw { width: 100%; height: 100%; display: grid; place-items: center; animation: swing 3s ease-in-out infinite; }
  .crest.real .sw { animation-delay: -1.5s; }
  .crest img { max-width: 100%; max-height: 100%; filter: drop-shadow(0 8px 14px rgba(0,0,0,.6)); }
  .crest .halo { position: absolute; inset: -10%; border-radius: 50%; filter: blur(24px); opacity: .8; animation: halo 2.2s ease-in-out infinite; z-index: -1; }
  .crest.barca .halo { background: radial-gradient(circle, #a50044, #004d98 60%, transparent 72%); }
  .crest.real .halo { background: radial-gradient(circle, #fff, #d4af37 60%, transparent 72%); }

  /* פס תחתון: קלאסיקו + ספירה */
  .strip { position: absolute; left: 270px; right: 270px; top: 352px; display: flex; flex-direction: column; align-items: center; gap: 8px; animation: up .8s .8s cubic-bezier(.2, 1.4, .4, 1) both; }
  .vs { font-family: Orbitron, monospace; font-weight: 900; font-size: 46px; line-height: 1; background: linear-gradient(180deg, #fff6c8, #febe10 55%, #b97a00); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #000) drop-shadow(0 0 14px rgba(254,190,16,.7)); animation: pulse 1.05s ease-in-out infinite; }
  .ttl { font-weight: 900; font-size: 34px; color: #fff; -webkit-text-stroke: 6px #000; paint-order: stroke fill; white-space: nowrap; }
  .ttl span { color: #febe10; }
  .cd { display: flex; align-items: center; gap: 6px; direction: ltr; padding: 8px 22px; border-radius: 22px; background: rgba(0,0,0,.62); border: 3px solid #febe10; box-shadow: 0 0 22px rgba(254,190,16,.45);
    font-family: Orbitron, monospace; font-weight: 900; font-size: 50px; line-height: 1; text-shadow: 0 0 12px rgba(254,190,16,.6); }
  .cd i { font-style: normal; color: #febe10; animation: blink 1s steps(1) infinite; }
  .cd b.t { display: inline-block; animation: tick .4s ease-out; }
  .when { font-weight: 800; font-size: 22px; -webkit-text-stroke: 5px #000; paint-order: stroke fill; }
  .live { display: none; font-weight: 900; font-size: 46px; color: #fff; padding: 8px 26px; border-radius: 22px; background: linear-gradient(90deg, #ff2d2d, #ff7a00); box-shadow: 0 0 30px rgba(255,90,0,.7); animation: pulse .9s ease-in-out infinite; white-space: nowrap; }
  body.started .cd, body.started .when { display: none; } body.started .live { display: block; }
  body.urgent .cd { border-color: #ff3b3b; box-shadow: 0 0 30px rgba(255,59,59,.8); color: #ffe0e0; animation: pulse .5s ease-in-out infinite; }

  /* אקולייזר */
  .eq { position: absolute; left: 60px; right: 60px; bottom: 26px; height: 54px; display: flex; align-items: flex-end; justify-content: center; gap: 6px; opacity: .85; }
  .eq i { flex: 1; max-width: 12px; border-radius: 6px 6px 2px 2px; background: linear-gradient(0deg, #febe10, #ff4d8d, #4fc3ff); animation: eq 1s ease-in-out infinite; }
  body.nobg .eq { display: none; }
  /* מצב וידאו: הלוח ממלא את כל המסגרת, בלי ספירה (השעה כתובה) */
  body.video { background: #0a0820; }
  body.video .panel { inset: 0; border-radius: 0; box-shadow: inset 0 0 0 7px #febe10, inset 0 0 50px rgba(254,190,16,.35); animation: none; }
  body.video .cd, body.video .when { display: none; }
  body.video .vtime { display: block; }
  .vtime { display: none; font-weight: 900; font-size: 46px; padding: 6px 30px; border-radius: 22px; background: rgba(0,0,0,.62); border: 3px solid #febe10; box-shadow: 0 0 22px rgba(254,190,16,.45); white-space: nowrap; direction: rtl; }
  .vtime b { font-family: Orbitron, monospace; color: #febe10; }
  .vsub { display: none; font-weight: 800; font-size: 24px; -webkit-text-stroke: 5px #000; paint-order: stroke fill; direction: rtl; }
  body.video .vsub { display: none; }

  @keyframes panelIn { from { transform: scaleY(.2); opacity: 0; } }
  @keyframes logoIn { 0% { transform: translateY(-140px) scale(.5) rotate(-8deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.035) rotate(-.6deg); } 30% { transform: scale(1); } 45% { transform: scale(1.018) rotate(.4deg); } }
  @keyframes shine { 0% { background-position: 150% 0; } 60%, 100% { background-position: -60% 0; } }
  @keyframes inRight { from { transform: translateX(260px) rotate(40deg) scale(.4); opacity: 0; } }
  @keyframes inLeft { from { transform: translateX(-260px) rotate(-40deg) scale(.4); opacity: 0; } }
  @keyframes swing { 0%, 100% { transform: rotate(-6deg) translateY(0); } 50% { transform: rotate(6deg) translateY(-10px); } }
  @keyframes halo { 50% { transform: scale(1.15); opacity: .5; } }
  @keyframes up { from { transform: translateY(60px); opacity: 0; } }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes sweep { from { background-position: 160% 0; } to { background-position: -100% 0; } }
  @keyframes blink { 50% { opacity: .45; } }
  @keyframes tick { from { transform: translateY(-25%); opacity: .3; } }
  @keyframes eq { 0%, 100% { height: 18%; } 50% { height: 100%; } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="panel"></div>

  <div class="eq" id="eq"></div>
</div>
<script>
  const Q = new URLSearchParams(location.search);
  if (Q.get('bg') === '0') document.body.classList.add('nobg');
  if (Q.get('video') === '1') document.body.classList.add('video');
  const fit = () => { const k = Math.min(innerWidth / 1080, innerHeight / 620) || 1; const w = document.getElementById('wrap'); w.style.transform = `scale(${k})`; w.style.left = ((innerWidth - 1080 * k) / 2) + 'px'; };
  addEventListener('resize', fit); fit();
  const $ = (id) => document.getElementById(id);

  // אקולייזר
  $('eq').innerHTML = Array.from({ length: 64 }, (_, i) => `<i style="animation-delay:${-(i * 37 % 100) / 100}s;animation-duration:${.6 + (i * 53 % 70) / 100}s"></i>`).join('');

  // ספירה: ברצלונה–ריאל, 21:00 בספרד = 22:00 בישראל
  const KICK = new Date(Q.get('t') || '2026-10-25T20:00:00Z').getTime();
  $('when').textContent = new Date(KICK).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jerusalem' }) + ' · קאמפ נואו';
  const set = (el, v) => { if (el.textContent !== v) { el.textContent = v; el.classList.remove('t'); void el.offsetWidth; el.classList.add('t'); } };
  let started = false;
  function tick() {
    const left = Math.max(0, Math.floor((KICK - Date.now()) / 1000));
    if (document.body.classList.contains('video')) return;
    document.body.classList.toggle('urgent', left > 0 && left <= 60);
    if (!left) { if (!started) { started = true; document.body.classList.add('started'); for (let i = 0; i < 6; i++) setTimeout(() => burst(540, 300), i * 300); } return; }
    set($('h'), String(Math.floor(left / 3600)).padStart(2, '0'));
    set($('m'), String(Math.floor(left % 3600 / 60)).padStart(2, '0'));
    set($('s'), String(left % 60).padStart(2, '0'));
  }
  setInterval(tick, 250); tick();

  // חלקיקים: תווים, כדורים, כוכבים וניצוצות בצבעי שתי הקבוצות
  const cv = $('fx'), cx = cv.getContext('2d');
  const COLS = ['#febe10', '#004d98', '#a50044', '#ffffff', '#4fc3ff', '#ff4d8d'];
  const GLYPH = ['♪', '♫', '⚽', '★', '♬'];
  let ps = [];
  function spawn() {
    const g = GLYPH[Math.floor(Math.random() * GLYPH.length)];
    ps.push({ x: 60 + Math.random() * 960, y: 640, vx: (Math.random() - .5) * 30, vy: -(40 + Math.random() * 70), s: 18 + Math.random() * 22, g, c: COLS[Math.floor(Math.random() * COLS.length)], a: 0, life: 1, rot: (Math.random() - .5) * 2 });
  }
  function burst(x, y) { for (let i = 0; i < 70; i++) { const a = Math.random() * 7, v = 120 + Math.random() * 380; ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, s: 8 + Math.random() * 10, g: '■', c: COLS[i % COLS.length], a: 0, life: 1.4, rot: (Math.random() - .5) * 8, grav: 1 }); } }
  const sparks = Array.from({ length: 40 }, () => ({ x: Math.random() * 1080, y: 70 + Math.random() * 520, p: Math.random() * 6, s: .5 + Math.random() * 1.6 }));
  let last = performance.now(), acc = 0;
  (function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    acc += dt; if (acc > .28) { acc = 0; spawn(); }
    cx.clearRect(0, 0, 1080, 620);
    for (const s of sparks) {
      const a = (Math.sin(now / 1000 * 2 * s.s + s.p) + 1) / 2;
      cx.globalAlpha = a * .9; cx.fillStyle = '#fff6c8';
      cx.beginPath(); const r = 1.5 + a * 2.5; cx.moveTo(s.x, s.y - r * 2); cx.lineTo(s.x + r * .5, s.y - r * .5); cx.lineTo(s.x + r * 2, s.y); cx.lineTo(s.x + r * .5, s.y + r * .5); cx.lineTo(s.x, s.y + r * 2); cx.lineTo(s.x - r * .5, s.y + r * .5); cx.lineTo(s.x - r * 2, s.y); cx.lineTo(s.x - r * .5, s.y - r * .5); cx.fill();
    }
    ps = ps.filter((p) => p.life > 0 && p.y > -60 && p.y < 700);
    for (const p of ps) {
      if (p.grav) p.vy += 500 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.rot * dt; p.life -= dt * (p.grav ? .6 : .14);
      cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life)) * .9; cx.translate(p.x, p.y); cx.rotate(p.a);
      cx.fillStyle = p.c; cx.font = `900 ${p.s}px "Segoe UI Symbol","Noto Sans Symbols","Segoe UI Emoji",sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.shadowColor = p.c; cx.shadowBlur = 10; cx.fillText(p.g, 0, 0); cx.restore();
    }
    cx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })(performance.now());
  // פיצוץ קונפטי כשהבאנר עולה
  setTimeout(() => { burst(150, 380); burst(930, 380); }, 1200);
</script>
