<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>ריאל נגד ברסה · קרב מתנות</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Orbitron:wght@900&display=swap">
<style>
  /* קרב מתנות ריאל מדריד נגד ברצלונה. גודל מקור 1080×600. מקבל את המתנות מ-TikStudio שפתוח במחשב.
     פרמטרים: ?end=22:00 (סיום הקרב) · ?real=Ice Cream Cone&barca=Rose (מתנות הקבוצות) · ?reset=1 (איפוס) · ?bg=1 (רקע) · ?demo=1 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: Rubik, 'Segoe UI', Arial, sans-serif; color: #fff; }
  .wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 600px; transform-origin: top left; direction: ltr; overflow: hidden; }
  .rtl { direction: rtl; }
  .stroke { -webkit-text-stroke: 7px #000; paint-order: stroke fill; }
  .num { font-family: Orbitron, monospace; font-variant-numeric: tabular-nums; }
  body.bg .wrap { background: radial-gradient(ellipse at center, #1a1440, #07051a 75%); }

  /* כותרת: סמלים + ניקוד */
  .top { position: absolute; top: 10px; left: 20px; right: 20px; height: 200px; display: flex; align-items: center; justify-content: space-between; }
  .team { display: flex; align-items: center; gap: 18px; }
  .team.barca { flex-direction: row-reverse; }
  .crest { position: relative; width: 150px; height: 170px; display: grid; place-items: center; }
  .crest img { max-width: 100%; max-height: 100%; filter: drop-shadow(0 8px 14px rgba(0,0,0,.6)); }
  .crest .halo { position: absolute; inset: 8%; border-radius: 50%; filter: blur(22px); opacity: .55; z-index: -1; }
  .real .halo { background: radial-gradient(circle, #fff, #d4af37 70%); } .barca .halo { background: radial-gradient(circle, #a50044, #004d98 70%); }
  .crest.bump img { animation: bump .6s cubic-bezier(.2, 1.8, .4, 1); }
  .lead .crest img { animation: lead 1.2s ease-in-out infinite; }
  .lead .crest::after { content: '👑'; position: absolute; top: -26px; font-size: 44px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); animation: lead 1.2s ease-in-out infinite; }
  .score { display: flex; flex-direction: column; gap: 2px; }
  .barca .score { align-items: flex-end; } .real .score { align-items: flex-start; }
  .score .n { font-size: 30px; font-weight: 900; }
  .score .c { font-size: 64px; line-height: 1; color: #febe10; }
  .score .c::after { content: ' 🪙'; font-size: 34px; }
  .vs { font-family: Orbitron, monospace; font-weight: 900; font-size: 64px; background: linear-gradient(180deg, #fff6c8, #febe10 55%, #b97a00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #000) drop-shadow(0 0 16px rgba(254,190,16,.7)); animation: pulse 1.1s ease-in-out infinite; }
  .timer { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 28px; padding: 4px 18px; border-radius: 14px; background: rgba(0,0,0,.65); border: 3px solid #febe10; display: none; }
  body.timed .timer { display: block; }

  /* הבר */
  .bar { position: absolute; left: 40px; right: 40px; top: 224px; height: 86px; border-radius: 99px; background: linear-gradient(90deg, #0a3d8f, #004d98 30%, #a50044 70%, #7a0033); border: 6px solid #febe10;
    box-shadow: 0 0 0 4px #000, 0 10px 30px rgba(0,0,0,.6), 0 0 40px rgba(254,190,16,.35); overflow: visible; }
  .bar .rm { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; border-radius: 99px 0 0 99px; background: linear-gradient(90deg, #ffffff, #eef1f8 70%, #d4af37); transition: width .8s cubic-bezier(.2, 1.2, .4, 1); overflow: hidden; }
  .bar .rm::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(27,42,107,.08) 0 16px, transparent 16px 32px); animation: stripes 1.2s linear infinite; }
  .bar .bstripes { position: absolute; inset: 0; border-radius: 99px; background: repeating-linear-gradient(45deg, rgba(0,0,0,.1) 0 16px, transparent 16px 32px); animation: stripes 1.2s linear infinite reverse; }
  .ball { position: absolute; top: 50%; left: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; display: grid; place-items: center; font-size: 88px; line-height: 1;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); transition: left .8s cubic-bezier(.2, 1.2, .4, 1); z-index: 2; }
  .ball span { display: block; animation: roll 2s linear infinite; }
  .pct { position: absolute; top: 50%; transform: translateY(-50%); font-size: 40px; z-index: 1; }
  .pct.r { left: 26px; color: #1b2a6b; text-shadow: 0 0 10px #fff; } .pct.b { right: 26px; color: #fff; text-shadow: 0 0 10px #000; }

  /* הוראות */
  .how { position: absolute; left: 24px; right: 24px; top: 322px; display: flex; justify-content: space-between; gap: 14px; }
  .side { flex: 1; padding: 6px 10px 8px; border-radius: 22px; background: rgba(0,0,0,.62); border: 3px solid; }
  .side.real { border-color: #d4af37; } .side.barca { border-color: #a50044; }
  .side h3 { text-align: center; font-size: 24px; font-weight: 900; margin-bottom: 4px; }
  .side.real h3 { color: #fff; } .side.barca h3 { color: #ffd3e4; }
  .gifts { display: flex; justify-content: space-between; gap: 6px; }
  .gt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 14px; background: rgba(255,255,255,.07); }
  .gt .im { width: 66px; height: 66px; display: grid; place-items: center; font-size: 48px; }
  .gt .im img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  .gt.big .im img { animation: wob 2.4s ease-in-out infinite; }
  .gt .gn { font-size: 18px; font-weight: 800; white-space: nowrap; }
  .gt .gc { font-family: Orbitron, monospace; font-size: 17px; font-weight: 900; color: #febe10; }
  .gt.hit { animation: hit .6s cubic-bezier(.2, 1.8, .4, 1); box-shadow: 0 0 0 3px #febe10, 0 0 20px #febe10; }
  @keyframes wob { 50% { transform: rotate(-8deg) scale(1.08); } }
  @keyframes hit { 40% { transform: scale(1.1); } }
  .join { position: absolute; left: 0; right: 0; top: 506px; text-align: center; font-size: 26px; font-weight: 900; }
  .join b { color: #febe10; }

  /* תורמים מובילים */
  .tops { position: absolute; left: 30px; right: 30px; top: 546px; display: flex; justify-content: space-between; }
  .tp { display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 99px; background: rgba(0,0,0,.55); font-size: 22px; font-weight: 800; max-width: 46%; }
  .tp.barca { flex-direction: row-reverse; padding: 6px 6px 6px 16px; }
  .tp .av { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex: none; display: grid; place-items: center; background: #febe10; color: #000; font-weight: 900; font-size: 22px; }
  .tp span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tp[hidden] { display: none; }

  /* פופאפ למתנה */
  .pop { position: absolute; top: 158px; display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 99px; background: rgba(0,0,0,.75); font-size: 26px; font-weight: 900; white-space: nowrap; animation: pop 2.2s ease-out forwards; z-index: 5; }
  .pop img { width: 50px; height: 50px; object-fit: contain; }
  .pop.real { left: 300px; border: 3px solid #d4af37; } .pop.barca { right: 300px; border: 3px solid #a50044; }
  .pop b { color: #febe10; }
  .banner { position: absolute; left: 50%; top: 250px; transform: translate(-50%, -50%) scale(0); font-size: 54px; font-weight: 900; padding: 10px 34px; border-radius: 24px; white-space: nowrap; z-index: 6; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  .banner.go { animation: banner 2.4s cubic-bezier(.2, 1.4, .4, 1) forwards; }
  .banner.real { background: linear-gradient(90deg, #fff, #f3e6b5); color: #1b2a6b; border: 5px solid #d4af37; }
  .banner.barca { background: linear-gradient(90deg, #004d98, #a50044); color: #fff; border: 5px solid #febe10; }

  /* סיום */
  .win { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(5,4,20,.78); z-index: 8; }
  body.over .win { display: flex; }
  .win img { height: 220px; animation: lead 1.2s ease-in-out infinite; filter: drop-shadow(0 0 30px #febe10); }
  .win h1 { font-size: 72px; font-weight: 900; color: #febe10; }
  .win p { font-size: 32px; font-weight: 800; }
  .conn { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 16px; padding: 3px 12px; border-radius: 99px; background: rgba(200,30,30,.85); display: none; }
  body.offline .conn { display: block; }
  canvas { position: absolute; inset: 0; pointer-events: none; z-index: 9; }

  @keyframes pulse { 50% { transform: scale(1.08); } }
  @keyframes stripes { to { background-position: 46px 0; } }
  @keyframes roll { to { transform: rotate(360deg); } }
  @keyframes bump { 40% { transform: scale(1.25) rotate(-6deg); } }
  @keyframes lead { 50% { transform: translateY(-8px) scale(1.04); } }
  @keyframes pop { 0% { opacity: 0; transform: translateY(30px) scale(.6); } 15% { opacity: 1; transform: translateY(0) scale(1.05); } 75% { opacity: 1; transform: translateY(-20px); } 100% { opacity: 0; transform: translateY(-50px); } }
  @keyframes banner { 0% { transform: translate(-50%, -50%) scale(0) rotate(-8deg); } 15% { transform: translate(-50%, -50%) scale(1.1) rotate(2deg); } 25%, 80% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(-50%, -50%) scale(0); } }
</style>
</head>

      <div class="score rtl"><div class="n stroke">ברצלונה</div><div class="c num stroke" id="sBarca">0</div></div></div>
  </div>
  <div class="timer num rtl" id="timer">00:00</div>

  <div class="bar"><div class="bstripes"></div><div class="rm" id="rm"></div><div class="pct r num" id="pR">50%</div><div class="pct b num" id="pB">50%</div><div class="ball" id="ball"><span>⚽</span></div></div>

  <div class="how">
    <div class="side real rtl"><h3>🤍 מתנות לריאל</h3><div class="gifts" id="gReal"></div></div>
    <div class="side barca rtl"><h3>💙❤️ מתנות לברסה</h3><div class="gifts" id="gBarca"></div></div>
  </div>
  <div class="join rtl stroke">כתבו בצ'אט <b>ריאל</b> או <b>ברסה</b> וכל המתנות שלכם יספרו לקבוצה שלכם!</div>
  <div class="tops">
    <div class="tp real rtl" id="topReal" hidden></div>
    <div class="tp barca rtl" id="topBarca" hidden></div>
  </div>

  <div class="banner rtl" id="banner"></div>
  <div class="win rtl"><img id="winImg" alt=""><h1 id="winT"></h1><p id="winP"></p></div>
  <div class="conn rtl">⚠️ אין חיבור. פתח את דף הממסר ב-TikStudio</div>
  <canvas id="fx" width="1080" height="600"></canvas>
</div>
<script>
(() => {
  const Q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  if (Q.get('bg') === '1') document.body.classList.add('bg');
  const fit = () => { const k = Math.min(innerWidth / 1080, innerHeight / 600) || 1; const w = $('wrap'); w.style.transform = `scale(${k})`; w.style.left = ((innerWidth - 1080 * k) / 2) + 'px'; };
  addEventListener('resize', fit); fit();
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Math.round(n).toLocaleString('he-IL');

  // ===== הגדרות =====
  // מתנות לכל קבוצה (1 / 100 / 500 / 1000 מטבעות). התמונה: מקטלוג TikTok, ואחרי שהמתנה מגיעה בלייב — התמונה הרשמית שלה
  const CDN = 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/';
  const BEET = (n) => `https://beetgames.com/images/gifts/${n.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '')}.webp`;
  const TEAM_GIFTS = {
    real: [
      { name: 'Ice Cream Cone', he: 'גלידה', coins: 1, emo: '🍦', img: '' },
      { name: 'Hand Hearts', he: 'ידיים לב', coins: 100, emo: '🫶', img: CDN + '6cd022271dc4669d182cad856384870f~tplv-obj.png' },
      { name: 'Money Gun', he: 'אקדח כסף', coins: 500, emo: '💸', img: '' },
      { name: 'Galaxy', he: 'גלקסיה', coins: 1000, emo: '🌌', img: '' },
    ],
    barca: [
      { name: 'Rose', he: 'ורד', coins: 1, emo: '🌹', img: CDN + 'eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.png' },
      { name: 'Paper Crane', he: 'עגורן נייר', coins: 99, emo: '🕊️', img: CDN + '0f158a08f7886189cdabf496e8a07c21~tplv-obj.png' },
      { name: 'Coral', he: 'אלמוג', coins: 499, emo: '🪸', img: CDN + 'd4faa402c32bf4f92bee654b2663d9f1~tplv-obj.png' },
      { name: 'Train', he: 'רכבת', coins: 899, emo: '🚂', img: '' },
    ],
  };
  // אפשר להחליף בכתובת: ?real=Ice Cream Cone,Hand Hearts,...&barca=Rose,...
  for (const t of ['real', 'barca']) if (Q.get(t)) TEAM_GIFTS[t] = Q.get(t).split(',').map((n) => ({ name: n.trim(), he: n.trim(), coins: 0, emo: '🎁', img: '' }));
  const GIFT_TEAM = {};
  for (const t of ['real', 'barca']) for (const g of TEAM_GIFTS[t]) GIFT_TEAM[g.name.toLowerCase()] = t;
  let learned = {};
  try { learned = JSON.parse(localStorage.getItem('clasico-gift-img') || '{}'); } catch { /* */ }
  function giftImg(g) {
    const list = [learned[g.name.toLowerCase()], g.img, BEET(g.name)].filter(Boolean);
    return `<img src="${list[0]}" data-alt="${list.slice(1).join('|')}" referrerpolicy="no-referrer" alt="" onerror="const a=(this.dataset.alt||'').split('|').filter(Boolean);if(a.length){this.dataset.alt=a.slice(1).join('|');this.src=a[0]}else{this.replaceWith(document.createTextNode('${g.emo}'))}">`;
  }
  function drawGifts() {
    for (const t of ['real', 'barca']) {
      $(t === 'real' ? 'gReal' : 'gBarca').innerHTML = TEAM_GIFTS[t].map((g) => `<div class="gt ${g.coins >= 100 ? 'big' : ''}" data-g="${g.name.toLowerCase()}"><div class="im">${giftImg(g)}</div><div class="gn">${g.he}</div><div class="gc">${g.coins ? g.coins.toLocaleString('he-IL') + ' 🪙' : ''}</div></div>`).join('');
    }
  }
  drawGifts();
  function learnImg(gift) {
    const k = String(gift.name || '').toLowerCase();
    if (!GIFT_TEAM[k] || !gift.image || learned[k] === gift.image) return;
    learned[k] = gift.image; try { localStorage.setItem('clasico-gift-img', JSON.stringify(learned)); } catch { /* */ }
    drawGifts();
  }
  const WORDS = {
    real: ['ריאל', 'מדריד', 'real', 'rm', 'rma', 'madrid', 'halamadrid', 'הלהמדריד', 'הלה', '🤍', '⚪'],
    barca: ['ברסה', 'ברצלונה', 'בארסה', 'barca', 'barça', 'fcb', 'barcelona', 'visca', 'ויסקה', '🔵🔴', '💙❤️', '❤️💙'],
  };
  const norm = (s) => String(s || '').replace(/[\p{Cf}️]/gu, '').trim().toLowerCase();
  function teamOfText(t) {
    t = norm(t); if (!t) return null;
    const first = t.split(/\s+/)[0].replace(/[!?.,]+/g, '');
    for (const team of ['real', 'barca']) if (WORDS[team].some((w) => first === w || t === w || (w.length > 3 && t.includes(w)))) return team;
    return null;
  }

  // ===== מצב (נשמר, כדי שרענון לא יאפס) =====
  const KEY = 'clasico-vs-' + (Q.get('key') || '1');
  let S = { real: 0, barca: 0, members: {}, sup: { real: {}, barca: {} }, lead: null };
  try { if (Q.get('reset') === '1') localStorage.removeItem(KEY); const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && !Q.get('demo')) S = { ...S, ...s }; } catch { /* */ }
  const save = () => { try { if (!Q.get('demo')) localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* */ } };

  // ===== סיום קרב =====
  let endAt = 0;
  if (Q.get('end')) {
    const [h, m] = Q.get('end').split(':').map(Number);
    const d = new Date(); d.setHours(h, m || 0, 0, 0); endAt = d.getTime();
    document.body.classList.add('timed');
  }
  let over = false;

  // ===== תצוגה =====
  function render() {
    const tot = S.real + S.barca;
    const pr = tot ? S.real / tot * 100 : 50;
    const clamp = Math.max(6, Math.min(94, pr));
    $('rm').style.width = clamp + '%';
    $('ball').style.left = clamp + '%';
    $('pR').textContent = Math.round(pr) + '%'; $('pB').textContent = Math.round(100 - pr) + '%';
    $('sReal').textContent = fmt(S.real); $('sBarca').textContent = fmt(S.barca);
    const lead = S.real > S.barca ? 'real' : S.barca > S.real ? 'barca' : null;
    $('tReal').classList.toggle('lead', lead === 'real'); $('tBarca').classList.toggle('lead', lead === 'barca');
    if (lead && S.lead && lead !== S.lead) showBanner(lead, lead === 'real' ? 'ריאל עוקפת! 🤍' : 'ברסה עוקפת! 💙❤️');
    if (lead) S.lead = lead;
    for (const t of ['real', 'barca']) {
      const el = $(t === 'real' ? 'topReal' : 'topBarca');
      const best = Object.values(S.sup[t]).sort((a, b) => b.coins - a.coins)[0];
      el.hidden = !best;
      if (best) el.innerHTML = `${best.avatar ? `<img class="av" src="${esc(best.avatar)}" referrerpolicy="no-referrer" alt="">` : `<span class="av">${esc((best.nick || '?')[0])}</span>`}<span>⭐ ${esc(best.nick)} · ${fmt(best.coins)} 🪙</span>`;
    }
  }
  function showBanner(team, text) {
    const b = $('banner'); b.className = 'banner rtl ' + team; b.textContent = text; void b.offsetWidth; b.classList.add('go');
  }
  function pop(team, user, gift, pts) {
    const el = document.createElement('div');
    el.className = 'pop rtl ' + team;
    const img = gift.image || gift.alt;
    el.innerHTML = `${img ? `<img src="${esc(img)}" referrerpolicy="no-referrer" alt="">` : '🎁'}<span>${esc(user.nick || '')}</span><b>+${fmt(pts)}</b>`;
    $('wrap').appendChild(el); setTimeout(() => el.remove(), 2300);
    const c = $(team === 'real' ? 'cReal' : 'cBarca'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
    burst(team === 'real' ? 140 : 940, 110, team, Math.min(60, 10 + pts));
  }

  function addPoints(team, user, gift) {
    if (over) return;
    const pts = Number(gift.total) || (Number(gift.coins) || 1) * (Number(gift.count) || 1);
    S[team] += pts;
    const key = user.id || user.name || user.nick;
    const sp = S.sup[team][key] || { nick: user.nick, avatar: user.avatar || '', coins: 0 };
    sp.coins += pts; sp.nick = user.nick || sp.nick; sp.avatar = user.avatar || sp.avatar;
    S.sup[team][key] = sp;
    pop(team, user, gift, pts); render(); save();
  }

  const seen = new Set();
  function onEvent(ev) {
    if (!ev || !ev.user) return;
    if (ev.id) { if (seen.has(ev.id)) return; seen.add(ev.id); if (seen.size > 5000) seen.clear(); }
    const key = ev.user.id || ev.user.name || ev.user.nick;
    if (ev.type === 'chat') {
      const t = teamOfText(ev.comment);
      if (t && S.members[key] !== t) { S.members[key] = t; save(); }
      return;
    }
    if (ev.type !== 'gift' || ev.streaking) return;
    const name = String(ev.gift?.name || '').toLowerCase();
    let team = GIFT_TEAM[name] || S.members[key];
    if (!team) return;
    if (GIFT_TEAM[name]) { S.members[key] = team; learnImg(ev.gift || {}); const tile = document.querySelector(`.gt[data-g="${CSS.escape(name)}"]`); if (tile) { tile.classList.remove('hit'); void tile.offsetWidth; tile.classList.add('hit'); } }
    addPoints(team, ev.user, ev.gift || {});
    const pts = Number(ev.gift?.total) || 0;
    if (pts >= 100) showBanner(team, `💥 ${ev.user.nick || ''} שלח ${pts.toLocaleString('he-IL')} 🪙 ל${team === 'real' ? 'ריאל' : 'ברסה'}!`);
  }

  function tickTimer() {
    if (!endAt || over) return;
    const left = Math.max(0, Math.floor((endAt - Date.now()) / 1000));
    const h = Math.floor(left / 3600), mm = Math.floor(left % 3600 / 60), ss = left % 60, p2 = (n) => String(n).padStart(2, '0');
    $('timer').textContent = '⏳ ' + (h ? h + ':' + p2(mm) : p2(mm)) + ':' + p2(ss);
    if (!left) finish();
  }
  function finish() {
    over = true;
    const w = S.real === S.barca ? null : S.real > S.barca ? 'real' : 'barca';
    document.body.classList.add('over');
    $('winImg').src = w ? (w === 'real' ? $('cReal').querySelector('img').src : $('cBarca').querySelector('img').src) : '';
    $('winImg').hidden = !w;
    $('winT').textContent = w ? `🏆 ${w === 'real' ? 'ריאל מדריד' : 'ברצלונה'} ניצחה!` : '🤝 תיקו!';
    $('winP').textContent = `ריאל ${fmt(S.real)} 🪙 · ברסה ${fmt(S.barca)} 🪙`;
    for (let i = 0; i < 8; i++) setTimeout(() => burst(200 + Math.random() * 680, 280, w || 'real', 70), i * 250);
  }
  setInterval(tickTimer, 250); tickTimer();

  // ===== קונפטי =====
  const cv = $('fx'), cx = cv.getContext('2d'); let ps = [];
  const COL = { real: ['#ffffff', '#d4af37', '#febe10', '#1b2a6b'], barca: ['#004d98', '#a50044', '#febe10', '#ffffff'] };
  function burst(x, y, team, n) { const cs = COL[team] || COL.real; for (let i = 0; i < n; i++) { const a = Math.random() * 7, v = 150 + Math.random() * 350; ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, r: 4 + Math.random() * 6, c: cs[i % cs.length], a: Math.random() * 6, va: (Math.random() - .5) * 10, life: 1.6 }); } }
  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    cx.clearRect(0, 0, 1080, 600);
    ps = ps.filter((p) => p.life > 0 && p.y < 640);
    for (const p of ps) { p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt; p.life -= dt * .7; cx.save(); cx.globalAlpha = Math.min(1, p.life); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 3, p.r * 2, p.r / 1.5); cx.restore(); }
    requestAnimationFrame(loop);
  })(last);

  render();

  // ===== חיבור ל-TikStudio במחשב =====
  if (Q.get('demo')) {
    const ppl = [['דנה', 'real'], ['יוסי', 'barca'], ['נועה', 'real'], ['אבי', 'barca'], ['שירה', 'barca']];
    let i = 0;
    setInterval(() => { const [n, t] = ppl[i++ % ppl.length]; const g = TEAM_GIFTS[t][i % 7 === 0 ? 2 : i % 3 === 0 ? 1 : 0]; onEvent({ type: 'gift', user: { id: n, nick: n }, gift: { name: g.name, coins: g.coins, count: 1, total: g.coins } }); }, 1300);
    return;
  }
  let wsOk = false, cloudOk = false, offT = null;
  const status = () => { clearTimeout(offT); if (wsOk || cloudOk) document.body.classList.remove('offline'); else offT = setTimeout(() => { if (!wsOk && !cloudOk) document.body.classList.add('offline'); }, 8000); };

  // 1) ענן: המתנות מגיעות דרך דף הממסר שפתוח במחשב (עובד גם מאתר ציבורי וגם בתוך LIVE Studio)
  const TOPIC = Q.get('relay') || 'ts-clasico-fbe642fc1dc9';
  function cloud() {
    const es = new EventSource(`${Q.get('ntfy') || 'https://ntfy.sh'}/${encodeURIComponent(TOPIC)}/sse`);
    es.onopen = () => { cloudOk = true; status(); };
    es.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.event !== 'message' || !m.message) return;
      let batch; try { batch = JSON.parse(m.message); } catch { return; }
      for (const it of Array.isArray(batch) ? batch : []) {
        if (it.t === 'g') onEvent({ id: it.i, type: 'gift', user: it.u || {}, gift: it.g || {} });
        else if (it.t === 'c') onEvent({ id: it.i, type: 'chat', user: it.u || {}, comment: it.c });
      }
    };
    es.onerror = () => { cloudOk = false; status(); };
  }
  if (Q.get('relay') !== '0') cloud();

  // 2) ישיר: אם הדף פתוח מתוך TikStudio עצמו (localhost) — מקבל את האירועים ישירות
  const local = /^(localhost|127\.0\.0\.1|localtest\.me)$/.test(location.hostname);
  const port = Q.get('port') || (local ? location.port : '8787') || '8787';
  const hosts = local ? [location.hostname] : ['127.0.0.1', 'localhost'];
  let hi = 0;
  function open() {
    let ws;
    try { ws = new WebSocket(`ws://${hosts[hi % hosts.length]}:${port}/ws?page=clasico-vs`); } catch { return; }
    let ok = false;
    ws.onopen = () => { ok = true; wsOk = true; status(); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch { return; } if (m.type === 'event') onEvent(m.event); };
    ws.onclose = () => { if (!ok) hi++; wsOk = false; status(); setTimeout(open, ok ? 2500 : 8000); };
    ws.onerror = () => {};
  }
  open();
})();
</script>
